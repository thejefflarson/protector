{{- if and .Values.engine.enabled .Values.serviceAccount.create }}
# The mitigation engine reads observed cluster state to build its security graph.
# These are the reads ADR-0001 documents the engine needs — the webhook makes no API
# calls, but the engine shares the pod's ServiceAccount, so the grant lives here.
# Read-only by default; the NetworkPolicy *write* rule is added ONLY under `mode: enforce`
# (derived from the same posture that arms the cut, ADR-0021), so a `mode: audit` (shadow)
# install has zero write grants — the grant cannot drift from whether the engine actuates.
#
# NOTE: list/watch on secrets grants read of secret *data* at the API level, even though
# the engine only retains metadata. That is the sensitive read the engine's value rests
# on; scope the cluster or split namespaces if that's too broad.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "protector.fullname" . }}-engine
  labels:
    {{- include "protector.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  # Declared L7 routes (ADR-0038): the IngressExposureAdapter walks Ingress/IngressClass
  # objects to make internet-exposure follow declared routing, so a route-forwarded
  # backend of a live internet-exposed controller becomes an entry. Read-only.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  # trivy-operator reports — the in-cluster, zero-egress scanner signal (ADR-0003).
  # Read-only; all harmless if the CRDs are absent — the engine degrades to no data for
  # whichever report kind is missing. vulnerabilityreports is the CVE source;
  # exposedsecretreports / configauditreports / rbacassessmentreports are the
  # breach/exposure/misconfiguration signals.
  - apiGroups: ["aquasecurity.github.io"]
    resources:
      - "vulnerabilityreports"
      - "exposedsecretreports"
      - "configauditreports"
      - "rbacassessmentreports"
    verbs: ["get", "list", "watch"]
  # Linkerd authorization policy (a mesh-native reachability source). Read-only;
  # harmless if the CRDs are absent (the engine degrades to NetworkPolicy-only
  # reachability).
  - apiGroups: ["policy.linkerd.io"]
    resources: ["servers", "authorizationpolicies", "meshtlsauthentications"]
    verbs: ["get", "list", "watch"]
  # Node fleet observation (ADR-0040 §3/§6) — metadata-only (name, the
  # node-role.kubernetes.io/control-plane label, spec.unschedulable, protector's own
  # cordon-ownership annotation; never .data, there is none on a Node). ALWAYS ON,
  # like every other read grant above: this is a READ, harmless under mode: audit (the
  # ContainNode class stays structurally unarmed either way, ADR-0040 §5), and the
  # node-containment rails need real fleet data the moment `enforceRung: node` is armed
  # — gating the read behind the rung too would leave the very first pass after arming
  # blind. The WRITE this read feeds (below) stays posture-derived.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  {{- if eq .Values.mode "enforce" }}
  # mode: enforce — the network actuator creates/deletes its own (managed-by: protector)
  # additive, reversible objects to quarantine/sever a corroborated attack path. The
  # networkpolicy actuator (the default) writes NetworkPolicies; the adminnetworkpolicy
  # actuator (Cilium/Calico) additionally writes AdminNetworkPolicies (ADR-0007/0010).
  #
  # NetworkPolicy is a NAMESPACED resource and the engine only writes cuts inside
  # `enforceScope` (ActuationScope::in_scope). When the scope is purely NAMESPACE-based
  # (no pod labels) the create/delete/patch grant is rendered instead as a per-namespace
  # Role + RoleBinding in each enforced namespace (see role.yaml) — least privilege, RBAC
  # matching the actuation reach — and is NOT granted cluster-wide here.
  #
  # The cluster-wide NetworkPolicy write grant below is kept ONLY when the scope includes
  # POD LABELS. A label-matched Pod can live in ANY namespace
  # (ActuationScope::endpoint_in_scope is "namespace listed OR label matched"), so the
  # engine may need to write a cut in a namespace not known at render time. A label-bearing
  # scope therefore can't be pre-narrowed to a fixed namespace list and retains the
  # cluster-wide grant.
  {{- if gt (len (keys .Values.enforceScope.labels)) 0 }}
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "patch"]
  {{- end }}
  # AdminNetworkPolicy is a CLUSTER-scoped resource (ADR-0007), so the adminnetworkpolicy
  # actuator's write grant is inherently cluster-wide and stays here even for a
  # namespace-only scope.
  {{- if eq .Values.engine.actuator "adminnetworkpolicy" }}
  - apiGroups: ["policy.networking.k8s.io"]
    resources: ["adminnetworkpolicies"]
    verbs: ["create", "delete", "patch"]
  {{- end }}
  {{- if eq .Values.enforceRung "node" }}
  # mode: enforce + enforceRung: node (ADR-0040 §6, ADR-0021 posture-derived RBAC) —
  # the top rung's ONLY new write surface: cordon a Node (Node.spec.unschedulable),
  # gated by the SAME deterministic rails regardless of this grant existing
  # (respond::actuator::node_containment::cordon_decision). `nodes` is IRREDUCIBLY
  # CLUSTER-SCOPED — unlike NetworkPolicy there is no namespaced Node kind to narrow
  # this to — so the grant is cluster-wide even for a namespace-only enforceScope;
  # `enforceScope`/the arming ladder still confine WHICH mitigations may name a
  # target, this only grants the mechanism. `patch` only: the engine never creates or
  # deletes a Node.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  {{- end }}
  {{- end }}
{{- end }}
